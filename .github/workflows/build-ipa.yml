name: Build unsigned IPA (codeberry-lite)

# Lite branch: editor + SwiftUI preview only, no AgentKit.
# Produces an unsigned IPA for re-signing (e.g. 小白签) and sideloading.

on:
  workflow_dispatch:
  push:
    branches: [codeberry-lite]

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.5
        run: |
          sudo xcode-select -s /Applications/Xcode_26.5.app
          xcodebuild -version
          echo "HEAD_SHA=$(git rev-parse HEAD)"

      - name: 1. List project schemes
        run: xcodebuild -list -project CodeBerry.xcodeproj

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project CodeBerry.xcodeproj \
            -scheme CodeBerry

      - name: 2. Simulator build
        run: |
          xcodebuild \
            -project CodeBerry.xcodeproj \
            -scheme CodeBerry \
            -sdk iphonesimulator \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: 3. Device build (unsigned, generic/platform=iOS)
        run: |
          xcodebuild \
            -project CodeBerry.xcodeproj \
            -scheme CodeBerry \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: 4. Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/CodeBerry.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: $APP_PATH not found"
            find build/DerivedData -maxdepth 4 -name "*.app" -type d || true
            exit 1
          fi
          echo "Found app bundle: $APP_PATH"
          rm -rf Payload CodeBerry-Lite-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          echo "--- Payload contents ---"
          ls -la Payload/CodeBerry.app
          /usr/bin/zip -qry CodeBerry-Lite-unsigned.ipa Payload
          echo "--- IPA ---"
          ls -lh CodeBerry-Lite-unsigned.ipa
          echo "--- IPA table of contents (sanity) ---"
          unzip -l CodeBerry-Lite-unsigned.ipa | grep "Payload/CodeBerry.app" | head -8

      - name: 5. Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeBerry-Lite-unsigned
          path: CodeBerry-Lite-unsigned.ipa
          if-no-files-found: error
